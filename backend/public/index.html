<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Vehicle Control Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">VC</div>
    <div>
      <div class="brand-title">Vehicle Control Sheet</div>
      <div class="brand-sub" id="dateLabel">--</div>
    </div>
  </div>
  <div style="display:flex; align-items:center; gap:10px;">
    <div class="shift-pill" id="dutyPill"><span class="dot"></span><span id="dutyLabel">--</span></div>
    <a href="admin.html" class="btn btn-outline btn-sm">Admin</a>
  </div>
</div>

<div class="container">

  <div class="summary-row">
    <div class="summary-card available">
      <div class="num" id="countAvailable">0</div>
      <div class="label">Available</div>
    </div>
    <div class="summary-card loaned">
      <div class="num" id="countLoaned">0</div>
      <div class="label">Loaned Out</div>
    </div>
    <div class="summary-card maintenance">
      <div class="num" id="countMaintenance">0</div>
      <div class="label">Out of Service</div>
    </div>
  </div>

  <div id="carGrid" class="car-grid"></div>
  <div id="emptyState" class="empty-state" style="display:none;">No cars set up yet. Go to Admin to add cars.</div>

</div>

<!-- LOAN MODAL -->
<div class="modal-overlay" id="loanModalOverlay">
  <div class="modal">
    <button class="close-x" onclick="closeModal('loanModalOverlay')">&times;</button>
    <h2>Loan a car</h2>
    <div class="sub" id="loanCarSub">Select a car and enter your staff number</div>

    <div class="field" id="carSelectField">
      <label>Car</label>
      <select id="loanCarSelect"></select>
    </div>

    <div class="field">
      <label>Your staff number</label>
      <input type="text" id="loanStaffNumber" inputmode="numeric" placeholder="e.g. 12345" autocomplete="off">
    </div>

    <div id="loanStaffConfirm"></div>

    <div class="field" id="newStaffNameField" style="display:none;">
      <label>Your name (staff number not found)</label>
      <input type="text" id="newStaffName" placeholder="Full name">
    </div>

    <div class="error-msg" id="loanError" style="display:none;"></div>

    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('loanModalOverlay')">Cancel</button>
      <button class="btn btn-primary" id="loanSubmitBtn" onclick="submitLoan()">Confirm loan</button>
    </div>
  </div>
</div>

<!-- RETURN MODAL -->
<div class="modal-overlay" id="returnModalOverlay">
  <div class="modal">
    <button class="close-x" onclick="closeModal('returnModalOverlay')">&times;</button>
    <h2>Return a car</h2>
    <div class="sub" id="returnCarSub">Confirm who is returning this car</div>

    <div class="loan-info" id="returnLoanInfo" style="margin-bottom:14px;"></div>

    <div class="field">
      <label>Returning staff number</label>
      <input type="text" id="returnStaffNumber" inputmode="numeric" placeholder="e.g. 12345" autocomplete="off">
    </div>

    <div id="returnStaffConfirm"></div>

    <div class="error-msg" id="returnError" style="display:none;"></div>

    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('returnModalOverlay')">Cancel</button>
      <button class="btn btn-danger" id="returnSubmitBtn" onclick="submitReturn()">Confirm return</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
